spring.application.name=raiz-nordeste-matriz
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/matriz
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=123456
spring.rabbitmq.virtual-host=/

# mensagem que falha no consumidor vai para a DLQ em vez de voltar à fila em loop
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Swagger / OpenAPI (springdoc): cada projeto publica a documentação na própria porta
# UI:   http://localhost:8080/swagger-ui.html
# JSON: http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# LiveReload do devtools com porta própria, para os dois projetos rodarem juntos sem conflito
spring.devtools.livereload.port=35729
